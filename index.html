<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#406053">
<title>Visita Técnica · Luvio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.3/jspdf.umd.min.js"></script>
<style>
  :root {
    --navy: #406053;
    --navy-mid: #334c42;
    --navy-light: #517a69;
    --gold: #c8973a;
    --cream: #f5f4f0;
    --warm-white: #faf9f7;
    --text-primary: #1a2332;
    --text-muted: #6b7a8d;
    --border: #dde2ea;
    --sim: #2a7a4b;      --sim-bg: #e8f5ee;
    --nao: #c0392b;      --nao-bg: #fdecea;
    --parcial: #d97706;  --parcial-bg: #fef3e0;
    --na: #6b7a8d;       --na-bg: #f0f2f5;
    --livre: #6a5aa8;    --livre-bg: #efecf7;
    --shadow-sm: 0 1px 3px rgba(26,35,50,0.08);
    --shadow-md: 0 4px 12px rgba(26,35,50,0.12);
    --shadow-lg: 0 8px 24px rgba(26,35,50,0.16);
    --radius: 10px;
    --radius-lg: 16px;
  }
  html, body { height: 100%; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-variant-ligatures: none; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', Verdana, Geneva, sans-serif;
    background: var(--cream);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    padding-bottom: var(--sab);
  }
  .screen { display: none; width: 100%; min-height: 100svh; }
  .screen.active { display: block; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, textarea { font-family: inherit; }

  /* ── HOME SCREEN ── */
  #home-screen {
    padding: calc(24px + var(--sat)) 16px calc(48px + var(--sab)) 16px;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-mid) 60%, var(--navy-light) 100%);
  }
  .home-card {
    background: white;
    border-radius: var(--radius-lg);
    max-width: 480px;
    width: 100%;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    margin: 0 auto;
  }
  .home-card-header {
    padding: 28px 24px 20px 24px;
    text-align: center;
    border-bottom: 4px solid var(--gold);
  }
  .home-logo { width: 88px; height: auto; margin: 0 auto 12px auto; display: block; }
  .home-title { font-size: 19px; font-weight: 800; letter-spacing: .2px; color: var(--text-primary); }
  .home-subtitle { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }
  .home-card-body { padding: 22px 20px 24px 20px; }

  .field-row { margin-bottom: 15px; }
  .field-label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .field-input {
    width: 100%; padding: 12px 13px; border: 1.5px solid var(--border); border-radius: var(--radius);
    font-size: 15px; font-weight: 500; color: var(--text-primary); background: var(--warm-white);
    transition: border-color .15s;
  }
  .field-input:focus { outline: none; border-color: var(--navy); background: white; }
  .field-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .choice-group { display: grid; gap: 8px; }
  .choice-group.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .choice-group.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .choice-btn {
    padding: 11px 6px; border: 1.5px solid var(--border); border-radius: var(--radius);
    font-size: 13.5px; font-weight: 600; color: var(--text-primary); background: var(--warm-white);
    text-align: center; transition: all .12s;
  }
  .choice-btn.active { background: var(--navy); border-color: var(--navy); color: white; }
  .choice-btn-other {
    margin-top: 7px; width: 100%; padding: 9px 11px; border: 1.5px dashed var(--border); border-radius: var(--radius);
    font-size: 13px; font-weight: 500; color: var(--text-muted); background: transparent;
  }
  .choice-btn-other:focus { outline: none; border-color: var(--navy); color: var(--text-primary); }

  .home-cta { width: 100%; padding: 15px; border-radius: var(--radius); font-size: 15.5px; font-weight: 700; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .home-cta-primary { background: var(--navy); color: white; box-shadow: var(--shadow-md); }
  .home-cta-secondary { background: white; color: var(--navy); border: 1.5px solid var(--navy); margin-top: 10px; }

  .home-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 4px 0; color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .home-divider::before, .home-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .drive-bar {
    display: flex; align-items: center; gap: 9px; padding: 11px 13px; border-radius: var(--radius);
    background: var(--warm-white); border: 1.5px solid var(--border); margin-top: 14px; font-size: 12.5px; font-weight: 600;
  }
  .drive-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--nao); flex-shrink: 0; }
  .drive-dot.on { background: var(--sim); }
  .drive-bar-text { flex: 1; color: var(--text-muted); }
  .drive-bar.connected .drive-bar-text { color: var(--sim); }
  .drive-connect-btn { font-size: 12px; font-weight: 700; color: var(--navy); text-decoration: underline; }

  .home-utility-row { display: flex; gap: 8px; margin-top: 12px; }
  .home-utility-btn {
    flex: 1; padding: 9px; border-radius: var(--radius); border: 1.5px solid var(--border);
    font-size: 12px; font-weight: 600; color: var(--text-muted); background: var(--warm-white); text-align: center;
  }
  .home-utility-btn.danger { color: var(--nao); }
  #home-file-input { display: none; }

  .home-resume-banner {
    display: none; background: var(--parcial-bg); border: 1.5px solid var(--parcial); border-radius: var(--radius);
    padding: 10px 12px; font-size: 12.5px; font-weight: 600; color: #8a5a05; margin-bottom: 14px;
  }

  /* ── APP SCREENS (checklist / premissas) ── */
  .app-screen { background: var(--cream); padding-bottom: 96px; }
  .app-header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
    padding: calc(16px + var(--sat)) 16px 14px 16px; position: sticky; top: 0; z-index: 20; box-shadow: var(--shadow-md);
  }
  .hdr-row { display: flex; align-items: center; gap: 11px; }
  .hdr-logo-sm { width: 38px; height: auto; border-radius: 6px; flex-shrink: 0; background: white; padding: 2px; }
  .hdr-title-wrap { flex: 1; min-width: 0; }
  .hdr-title { font-size: 15px; font-weight: 800; color: white; }
  .hdr-subtitle { font-size: 11.5px; color: rgba(255,255,255,.75); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr-drive-pill { display:flex; align-items:center; gap:5px; padding:5px 9px; border-radius:20px; background:rgba(255,255,255,.14); flex-shrink:0; }
  .hdr-drive-dot { width:7px; height:7px; border-radius:50%; background:#e8b4ab; }
  .hdr-drive-dot.on { background:#8fd9b3; }
  .hdr-drive-label { font-size: 10.5px; font-weight: 700; color: white; }

  .progress-wrap { margin-top: 12px; }
  .progress-track { height: 6px; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width .25s; width:0%; }
  .progress-label { font-size: 10.5px; color: rgba(255,255,255,.8); font-weight: 600; margin-top: 5px; }

  .cabecalho-mini { margin: 12px 16px 0 16px; background: white; border: 1.5px solid var(--border); border-radius: var(--radius); padding: 10px 13px; display:flex; align-items:center; gap:8px; box-shadow: var(--shadow-sm); }
  .cabecalho-mini-text { flex:1; font-size:12px; color: var(--text-muted); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cabecalho-mini-edit { font-size: 11px; font-weight:700; color: var(--navy); }

  .sections-wrap { padding: 14px 12px 20px 12px; max-width: 640px; margin: 0 auto; }

  .section-block { background: white; border-radius: var(--radius-lg); margin-bottom: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; }
  .section-header { display: flex; align-items: center; gap: 10px; padding: 14px 15px; cursor: pointer; }
  .section-icon { font-size: 19px; flex-shrink: 0; width: 26px; text-align: center; }
  .section-name-wrap { flex: 1; min-width: 0; }
  .section-name { font-size: 14.5px; font-weight: 700; color: var(--text-primary); }
  .section-meta { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 1px; }
  .section-meta.done { color: var(--sim); }
  .section-na-btn { font-size: 10.5px; font-weight: 700; color: var(--na); background: var(--na-bg); padding: 6px 9px; border-radius: 8px; flex-shrink:0; }
  .section-chevron { font-size: 12px; color: var(--text-muted); transition: transform .2s; flex-shrink:0; }
  .section-block.open .section-chevron { transform: rotate(180deg); }
  .section-body { display: none; padding: 2px 12px 14px 12px; }
  .section-block.open .section-body { display: block; }

  .item-card { padding: 13px 4px; border-top: 1px solid var(--border); }
  .item-card:first-child { border-top: none; }
  .item-q { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 9px; line-height: 1.35; }
  .item-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .opt-btn { padding: 9px 4px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 12px; font-weight: 700; color: var(--text-muted); background: var(--warm-white); text-align:center; }
  .opt-btn.active-sim { background: var(--sim-bg); border-color: var(--sim); color: var(--sim); }
  .opt-btn.active-nao { background: var(--nao-bg); border-color: var(--nao); color: var(--nao); }
  .opt-btn.active-parcial { background: var(--parcial-bg); border-color: var(--parcial); color: var(--parcial); }
  .opt-btn.active-na { background: var(--na-bg); border-color: var(--na); color: var(--na); }
  .item-free-input {
    width: 100%; margin-top: 7px; padding: 8px 10px; border: 1.5px dashed var(--border); border-radius: 9px;
    font-size: 12.5px; font-weight: 500; color: var(--text-primary); background: transparent;
  }
  .item-free-input:focus { outline:none; border-style: solid; border-color: var(--livre); }
  .item-free-input.has-value { border-style: solid; border-color: var(--livre); background: var(--livre-bg); color: var(--livre); font-weight:600; }
  .item-card.answered-livre .item-q::after { content:'✎'; margin-left:6px; color: var(--livre); }

  .item-obs-toggle { margin-top: 8px; font-size: 11.5px; font-weight: 600; color: var(--text-muted); display:flex; align-items:center; gap:4px; }
  .item-obs-toggle.has-text { color: var(--navy); }
  .item-obs-wrap { display:none; margin-top: 7px; }
  .item-obs-wrap.open { display:block; }
  .item-obs-area { width:100%; min-height: 60px; padding: 9px 10px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 12.5px; resize: vertical; background: var(--warm-white); }
  .item-obs-area:focus { outline:none; border-color: var(--navy); background:white; }

  /* ── PREMISSAS FIELD TYPES ── */
  .pf-group-label { font-size: 11px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: .5px; margin: 14px 4px 6px 4px; }
  .pf-group-label:first-child { margin-top: 4px; }
  .pf-field { padding: 12px 4px; border-top: 1px solid var(--border); }
  .pf-field:first-child, .pf-group-label + .pf-field { border-top: none; }
  .pf-label { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; line-height:1.35; }
  .pf-choice-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .pf-choice-row.c3 { grid-template-columns: repeat(3, 1fr); }
  .pf-text-input { width: 100%; padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 13px; background: var(--warm-white); }
  .pf-text-input:focus { outline:none; border-color: var(--navy); background: white; }
  .pf-note { font-size: 11.5px; font-style: italic; color: var(--text-muted); background: var(--warm-white); border-left: 3px solid var(--gold); padding: 8px 10px; border-radius: 6px; margin: 10px 4px; line-height:1.4; }
  .pf-conditional { margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--border); display:none; }
  .pf-conditional.show { display:block; }
  .pf-multiselect-row { display:flex; flex-wrap:wrap; gap: 6px; }
  .pf-ms-btn { padding: 9px 13px; border: 1.5px solid var(--border); border-radius: 9px; font-size:12.5px; font-weight:700; color: var(--text-muted); background: var(--warm-white); text-align:center; }
  .pf-ms-btn.active { background: var(--navy); border-color: var(--navy); color: white; }
  .pf-ms-btn.active-sim { background: var(--sim-bg); border-color: var(--sim); color: var(--sim); }
  .pf-ms-btn.active-nao { background: var(--nao-bg); border-color: var(--nao); color: var(--nao); }
  .pf-allocate-row { display:flex; align-items:center; gap:8px; padding: 7px 2px; border-bottom: 1px dashed var(--border); }
  .pf-allocate-row:last-child { border-bottom:none; }
  .pf-allocate-name { flex:1; font-size:12.5px; font-weight:600; color: var(--text-primary); }
  .pf-allocate-btns { display:flex; gap:5px; }
  .pf-allocate-btn { padding: 6px 11px; border: 1.5px solid var(--border); border-radius: 7px; font-size: 11px; font-weight:700; color: var(--text-muted); background: var(--warm-white); }
  .pf-allocate-btn.active { background: var(--navy); border-color: var(--navy); color: white; }
  .pf-allocate-warning { margin-top: 8px; padding: 8px 10px; background: var(--nao-bg); border: 1.5px solid var(--nao); border-radius: 8px; font-size: 11.5px; font-weight:600; color: var(--nao); }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    position: fixed; left:0; right:0; bottom:0; z-index: 30;
    display:flex; gap:10px; padding: 12px 14px calc(12px + var(--sab)) 14px;
    background: white; border-top: 1px solid var(--border); box-shadow: 0 -4px 16px rgba(26,35,50,.1);
  }
  .bottom-btn { flex:1; padding: 13px; border-radius: var(--radius); font-size: 14px; font-weight: 700; display:flex; align-items:center; justify-content:center; gap:7px; }
  .bottom-btn-voltar { background: var(--warm-white); color: var(--text-primary); border: 1.5px solid var(--border); flex: 0.85; }
  .bottom-btn-pdf { background: var(--navy); color: white; box-shadow: var(--shadow-md); flex: 1.15; }
  .bottom-btn-pdf:disabled { opacity: .6; }

  /* ── TOAST ── */
  #toast { position: fixed; left:50%; bottom: 92px; transform: translateX(-50%) translateY(20px); background: var(--text-primary); color:white; padding: 11px 18px; border-radius: 30px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); z-index: 100; opacity:0; pointer-events:none; transition: all .25s; max-width: 90%; text-align:center; }
  #toast.show { opacity:1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 640px) {
    .sections-wrap, .bottom-bar > * { max-width: 640px; }
    .bottom-bar { justify-content: center; }
    .bottom-bar .bottom-btn { max-width: 260px; }
  }

  /* ── Margens de segurança (barras do sistema no Android; 0 no browser) ── */
  :root {
    --sat: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
    --sab: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
  }

  /* ── Ações do item: observações + fotografia ── */
  .item-actions { display: flex; gap: 8px; margin-top: 8px; }
  .item-act-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 9px 6px; border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 12px; font-weight: 600; color: var(--text-muted); background: var(--warm-white);
  }
  .item-act-btn.has { color: var(--navy); border-color: var(--navy); background: #eef3f0; }

  /* ── Fotografias ── */
  .photo-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .photo-row:empty { display: none; }
  .photo-thumb-wrap { position: relative; display: inline-block; }
  .photo-thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 9px; border: 1.5px solid var(--border); background: var(--warm-white); display: block; cursor: pointer; }
  .photo-thumb.ph { display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-muted); }
  .photo-thumb-wrap.is-uploading .photo-thumb { opacity: 0.45; }
  .photo-spinner { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; }
  .photo-thumb-wrap.is-uploading .photo-spinner { display: flex; }
  .photo-spinner svg { width: 20px; height: 20px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .photo-fail-badge { display: none; position: absolute; bottom: 3px; right: 3px; background: #c0392b; color: white; border-radius: 50%; width: 17px; height: 17px; font-size: 11px; line-height: 17px; text-align: center; font-weight: 700; }
  .photo-thumb-wrap.is-failed .photo-fail-badge { display: block; }
  .photo-delete-btn { display: none; position: absolute; top: 3px; right: 3px; width: 21px; height: 21px; border-radius: 50%; background: rgba(0,0,0,0.65); color: white; font-size: 14px; line-height: 21px; text-align: center; cursor: pointer; font-weight: 700; z-index: 2; }
  .photo-thumb-wrap:hover .photo-delete-btn, .photo-thumb-wrap.show-delete .photo-delete-btn { display: block; }
  .photo-thumb-wrap.is-uploading .photo-delete-btn { display: none !important; }

  /* ── Janelas: ver fotografia e escolher origem ── */
  #photo-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: none; align-items: center; justify-content: center; }
  #photo-modal.open { display: flex; }
  #photo-modal img { max-width: 96vw; max-height: 88vh; object-fit: contain; border-radius: 6px; }
  .modal-close { position: absolute; top: calc(12px + var(--sat)); right: 14px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.18); color: white; font-size: 22px; line-height: 38px; text-align: center; }
  #photo-source-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 190; display: none; align-items: flex-end; justify-content: center; }
  .psm-sheet { width: 100%; max-width: 520px; background: white; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + var(--sab)) 16px; }
  .psm-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-align: center; margin-bottom: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .psm-btn { width: 100%; padding: 15px; border-radius: var(--radius); font-size: 15px; font-weight: 700; margin-bottom: 9px; border: 1.5px solid var(--border); background: var(--warm-white); color: var(--text-primary); }
  .psm-btn.primary { background: var(--navy); border-color: var(--navy); color: white; }
  .psm-btn.cancel { color: var(--text-muted); margin-bottom: 0; background: white; }

  #loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.82); z-index: 250; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #loading-overlay.open { display: flex; }
  .loading-spinner { width: 38px; height: 38px; border: 4px solid var(--border); border-top-color: var(--navy); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .app-mode-line { text-align: center; font-size: 10.5px; font-weight: 600; color: var(--text-muted); margin-top: 14px; }
  #loading-text { font-size: 13px; font-weight: 700; color: var(--navy); }
</style>
</head>
<body>

<!-- ══════════════════ HOME SCREEN ══════════════════ -->
<div id="home-screen" class="screen active">

      <div class="field-row">
        <label class="field-label">ID do imóvel</label>
        <input type="text" class="field-input" id="f-idimovel" placeholder="ex: LV048" autocapitalize="characters">

      <div class="field-row">
        <label class="field-label">Morada</label>
        <input type="text" class="field-input" id="f-morada" placeholder="Rua, número, andar">
      </div>
      <div class="field-row field-row-2">
        <div>
          <label class="field-label">Código Postal</label>
          <input type="text" class="field-input" id="f-cp" placeholder="0000-000">
        </div>
        <div>

        </div>
      </div>

      </div>

      <div class="field-row field-row-2">
        <div>
          <label class="field-label">Área do imóvel</label>

        </div>
        <div>
          <label class="field-label">Tipologia</label>
          <div class="choice-group cols-4" id="grp-tipologia"></div>
        </div>
      </div>

      <button class="home-cta home-cta-secondary" onclick="goToPremissas()">▥ Preencher Premissas</button>

        <div class="drive-connect-btn" id="drive-connect-label">Ligar</div>
      </div>

      <div class="home-utility-row">
        <button class="home-utility-btn" onclick="exportSessionFile()">⭳ Guardar sessão</button>
        <button class="home-utility-btn" onclick="document.getElementById('home-file-input').click()">⭱ Retomar</button>
        <button class="home-utility-btn danger" onclick="clearAllData()">✕ Limpar</button>
      </div>
      <input type="file" id="home-file-input" accept="application/json" onchange="importSessionFile(event)">
      <div class="app-mode-line" id="app-mode-line"></div>

// Dentro da APK a página corre num WebView do Capacitor, que injeta o objeto

// não existe: IS_NATIVE fica false e tudo o que é nativo fica desligado, por

// Ligação ao Drive na APK: usa o AuthorizationClient do Google Play Services
// (plugin DriveAuth). Depois da 1.ª autorização o token renova-se sozinho,
// sem ecrãs nem redirecionamentos — acaba o login de hora a hora da PWA.
const NATIVE_TOKEN_TTL_MS = 45 * 60 * 1000;   // o token vale ~1 h; renova-se antes
let _nativeAuthChain = Promise.resolve();      // serializa pedidos: nunca há 2 em simultâneo

function nativeAuthorize(interactive) {
  const run = _nativeAuthChain.then(async function() {
    // outra chamada pode já ter renovado o token entretanto
    if (driveState.accessToken && Date.now() < driveState.tokenExpiresAt) return driveState.accessToken;
    const api = await nativeReady;
    if (!api) throw new Error('Plugins nativos indisponíveis.');
    try {
      const res = await api.DriveAuth.authorize({ interactive: !!interactive });
      driveState.accessToken = res.accessToken;
      driveState.tokenExpiresAt = Date.now() + NATIVE_TOKEN_TTL_MS;
      setDriveStatus('connected');
      onDriveConnected();
      return res.accessToken;
    } catch (err) {
      driveState.accessToken = null;
      setDriveStatus('disconnected');
      throw err;
    }
  });
  _nativeAuthChain = run.catch(function() {});
  return run;
}

// Tenta ligar em silêncio (sem ecrãs), com limite de tempo — nunca bloqueia o arranque.
async function nativeSilentConnect(ms) {
  if (!IS_NATIVE || driveState.connected) return;
  try {
    await Promise.race([
      nativeAuthorize(false),
      new Promise(function(_, reject) { setTimeout(function() { reject(new Error('timeout')); }, ms); }),
    ]);
  } catch (e) { /* segue sem Drive; o utilizador liga no indicador "Drive" */ }
}

function nativeAuthErrorMessage(err) {
  const code = err && err.code ? String(err.code) : '';
  const msg = String((err && err.message) || err || '');
  if (code === 'cancelled' || /cancel/i.test(msg)) return 'Ligação ao Drive cancelada.';
  if (code === 'api_10' || /DEVELOPER_ERROR|\b10:/.test(msg)) return 'Google Cloud: o cliente Android (pacote/SHA-1) não corresponde a esta APK — ver instruções.';
  if (code === 'api_7' || /network/i.test(msg)) return 'Sem ligação à internet.';
  return 'Não foi possível ligar ao Google Drive' + (code ? ' (' + code + ')' : '') + '.';
}

// ── OAuth via redirect de página completa (sem popups) ──
// Ver nota técnica original na Vistoria Final de Obra: popups falham
// silenciosamente em PWA standalone Android. Solução: navegação de topo
// para o consentimento da Google, regresso com token no fragmento (#...).
//
// IMPORTANTE (configuração única no Google Cloud Console, credencial
// partilhada com as restantes PWAs Luvio): em "Credenciais" → o Client ID
// OAuth → "URIs de redirecionamento autorizados", adicionar exatamente o
// URL onde este ficheiro fica publicado (ex: https://pedroluvio.github.io/visita-tecnica/),
// sem # nem ?. Isto é diferente de "Origens JavaScript autorizadas".

const DRIVE_AUTH_ENDPOINT = 'https://accounts.google.com/o/oauth2/v2/auth';
const DRIVE_OAUTH_STATE_KEY = 'drive_oauth_state_v1';

function driveRedirectUri() {
  return location.origin + location.pathname;
}

function buildDriveAuthUrl() {
  const nonce = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
  _storage().setItem(DRIVE_OAUTH_STATE_KEY, nonce);
  const params = new URLSearchParams({
    client_id: DRIVE_CLIENT_ID,
    redirect_uri: driveRedirectUri(),
    response_type: 'token',
    scope: DRIVE_SCOPES,
    include_granted_scopes: 'true',
    state: nonce,
  });
  return DRIVE_AUTH_ENDPOINT + '?' + params.toString();
}

function connectDrive(manual) {
  if (IS_NATIVE) {
    // APK: login nativo do Google (sem sair da app)
    setDriveStatus('connecting');
    return nativeAuthorize(true);
  }
  try { saveState(); } catch (e) {}
  setDriveStatus('connecting');
  window.location.href = buildDriveAuthUrl();
  return new Promise(function() {});
}

function consumeDriveRedirectToken() {
  if (!location.hash || (location.hash.indexOf('access_token') === -1 && location.hash.indexOf('error') === -1)) return false;
  const params = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname + location.search);

  const expected = _storage().getItem(DRIVE_OAUTH_STATE_KEY);
  _storage().removeItem(DRIVE_OAUTH_STATE_KEY);

  const error = params.get('error');
  if (error) {
    console.warn('Drive auth error:', error);
    setDriveStatus('disconnected');
    showToast('Login Google cancelado ou falhou.');
    return true;
  }
  const token = params.get('access_token');
  const returnedState = params.get('state');
  if (!token || !expected || returnedState !== expected) {
    console.warn('Drive auth: state inválido ou token ausente.');
    setDriveStatus('disconnected');
    showToast('Falha na verificação do login Google — tente novamente.');
    return true;
  }
  driveState.accessToken = token;
  driveState.tokenExpiresAt = Date.now() + (parseInt(params.get('expires_in') || '3600', 10) * 1000) - 60000;
  setDriveStatus('connected');
  showToast('Ligado ao Google Drive.');
  return true;
}

async function ensureValidToken() {
  if (driveState.accessToken && Date.now() < driveState.tokenExpiresAt) return driveState.accessToken;
  if (IS_NATIVE) {
    // APK: renovação silenciosa pelo Google Play Services (sem ecrãs)
    try { return await nativeAuthorize(false); }
    catch (e) { throw new Error('Sessão do Drive expirou — toque no indicador "Drive" para voltar a ligar.'); }
  }
  driveState.accessToken = null;
  setDriveStatus('disconnected');
  throw new Error('Sessão do Drive expirou — toque no indicador "Drive" para voltar a ligar.');
}

async function driveApiFetch(url, options) {
  options = options || {};
  let token = await ensureValidToken();
  const sep = url.indexOf('?') >= 0 ? '&' : '?';
  // Na APK o pedido não tem a origem "pedroluvio.github.io": a chave de API
  // (que pode estar limitada a esse domínio) é dispensável — o token OAuth
  // já identifica a app.
  const finalUrl = IS_NATIVE ? url : url + sep + 'key=' + DRIVE_API_KEY;
  const send = function(t) {
    const headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + t });
    return fetch(finalUrl, Object.assign({}, options, { headers: headers }));
  };
  let res = await send(token);
  if (res.status === 401 && IS_NATIVE) {
    // Token rejeitado: limpa-o da cache do Play Services e pede outro, sem ecrãs
    const bad = driveState.accessToken;
    driveState.accessToken = null;
    try {
      const api = await nativeReady;
      if (api && bad) await api.DriveAuth.clearToken({ accessToken: bad });
      token = await nativeAuthorize(false);
      res = await send(token);
    } catch (e) { /* cai para o erro abaixo */ }
  }
  if (res.status === 401) {
    driveState.accessToken = null;
    setDriveStatus('disconnected');
    throw new Error('Sessão do Drive expirou — toque no indicador "Drive" para voltar a ligar.');
  }
  return res;
}

function escapeDriveQuery(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

async function findFolder(name, parentId) {
  const q = "name='" + escapeDriveQuery(name) + "' and mimeType='" + DRIVE_FOLDER_MIME + "' and trashed=false and '" +
    (parentId || 'root') + "' in parents";
  const res = await driveApiFetch(DRIVE_API_FILES + '?q=' + encodeURIComponent(q) + '&fields=files(id,name)&spaces=drive');
  if (!res.ok) throw new Error('Erro ao procurar pasta no Drive (' + res.status + ')');
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function createFolder(name, parentId) {
  const meta = { name: name, mimeType: DRIVE_FOLDER_MIME };
  if (parentId) meta.parents = [parentId];
  const res = await driveApiFetch(DRIVE_API_FILES + '?fields=id', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(meta),
  });
  if (!res.ok) throw new Error('Erro ao criar pasta no Drive (' + res.status + ')');
  const data = await res.json();
  return data.id;
}

// itemId = "<secId>_<índice>" (ex: "est_1") → secção e pergunta correspondentes
function getItemInfo(itemId) {
  const i = String(itemId).lastIndexOf('_');
  if (i < 0) return null;
  const secId = itemId.slice(0, i), idx = parseInt(itemId.slice(i + 1), 10);
  for (let si = 0; si < CHECKLIST_SECTIONS.length; si++) {
    const sec = CHECKLIST_SECTIONS[si];
    if (sec.id === secId && sec.items[idx] !== undefined) {
      return { secNum: si + 1, secName: sec.name, itemNum: idx + 1, label: sec.items[idx] };
    }
  }
  return null;
}
function sectionFolderName(info) { return info ? info.secNum + ' - ' + info.secName : null; }

function safeFileFragment(s, max) {
  return String(s).replace(/[\\\/]+/g, '-').replace(/[:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max || 40).trim();
}

let _photoSeq = 0;
function buildPhotoFilename(file, itemId) {
  const ext = (file.type === 'image/png') ? 'png' : 'jpg';
  _photoSeq++;
  const info = getItemInfo(itemId);
  const d = new Date();
  const pad = function(n) { return String(n).padStart(2, '0'); };
  const stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  const prefix = info ? info.secNum + '.' + info.itemNum + ' ' + safeFileFragment(info.label, 45) : itemId;
  return prefix + ' - ' + stamp + '-' + _photoSeq + '.' + ext;
}

  const sectionFolderId = await ensureSectionFolder(sectionFolderName(getItemInfo(itemId)));
  const metadata = { name: buildPhotoFilename(file, itemId), parents: [sectionFolderId] };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', file);
  const res = await driveApiFetch(DRIVE_UPLOAD_FILES + '?uploadType=multipart&fields=id,name,mimeType', {

  if (!res.ok) throw new Error('Falha ao enviar fotografia para o Drive (' + res.status + ')');
  const data = await res.json();

}

function blobToDataUrl(blob) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function() { resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// Reduz para uma miniatura ANTES de guardar em cache: guardar fotos em resolução
// de câmara (vários MB cada) em memória é o que mais facilmente esgota o WebView.
function downscaleImageToObjectUrl(srcUrl, maxDim) {
  return new Promise(function(resolve, reject) {
    let settled = false;
    const timeoutId = setTimeout(function() {
      if (settled) return;
      settled = true;
      reject(new Error('Tempo esgotado a gerar miniatura'));
    }, 8000);
    const img = new Image();
    img.onload = function() {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      try {
        const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob) {
          if (!blob) { reject(new Error('Falha ao gerar miniatura')); return; }
          resolve(URL.createObjectURL(blob));
        }, 'image/jpeg', 0.7);
      } catch (e) { reject(e); }
    };
    img.onerror = function() {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      reject(new Error('Falha ao carregar imagem para miniatura'));
    };
    img.src = srcUrl;
  });
}

const PHOTO_THUMB_MAX_DIM = 360;

async function fetchPhotoFullBlob(driveId) {
  const res = await driveApiFetch(DRIVE_API_FILES + '/' + driveId + '?alt=media');
  if (!res.ok) throw new Error('Não foi possível obter a fotografia do Drive (' + res.status + ')');
  return await res.blob();
}

async function fetchPhotoBlob(driveId) {
  if (photoBlobCache[driveId]) return photoBlobCache[driveId];
  const fullBlob = await fetchPhotoFullBlob(driveId);
  const fullUrl = URL.createObjectURL(fullBlob);
  try {
    const thumbUrl = await downscaleImageToObjectUrl(fullUrl, PHOTO_THUMB_MAX_DIM);
    URL.revokeObjectURL(fullUrl);
    photoBlobCache[driveId] = thumbUrl;
  } catch (e) {
    photoBlobCache[driveId] = fullUrl;   // sem miniatura (raro): usa a original
  }
  return photoBlobCache[driveId];
}

// Fotografia (já no Drive, ou ainda só local) → data URI base64 para o PDF.
// Não fica em cache: a versão pronta para o PDF (reduzida) é guardada em pdfPhotoCache.
async function resolvePhotoDataUrl(entry) {
  if (entry.driveId) return await blobToDataUrl(await fetchPhotoFullBlob(entry.driveId));
  const cachedBlobUrl = entry.tempKey && photoBlobCache[entry.tempKey];
  if (cachedBlobUrl) {
    try { return await blobToDataUrl(await (await fetch(cachedBlobUrl)).blob()); } catch (e) { /* ainda não está no Drive */ }
  }
  return null;
}

// Só referências do Drive vão para o JSON (nunca base64, nunca envios incompletos).
function getCleanPhotosForExport() {
  const out = {};
  const photos = state.checklist.photos || {};
  for (const id in photos) {
    const clean = (photos[id] || [])
      .filter(function(p) { return p && p.driveId; })
      .map(function(p) { return { driveId: p.driveId, name: p.name, mimeType: p.mimeType }; });
    if (clean.length) out[id] = clean;
  }
  return out;
}

function revokePhotoCaches() {
  Object.keys(photoBlobCache).forEach(function(k) { try { URL.revokeObjectURL(photoBlobCache[k]); } catch (e) {} delete photoBlobCache[k]; });
  Object.keys(pdfPhotoCache).forEach(function(k) { delete pdfPhotoCache[k]; });
}

// Descarrega, uma a uma, as miniaturas das fotografias referenciadas (memória!) e
// repinta a linha de cada item à medida que chegam.
let _hydratingPhotos = false;
async function hydrateChecklistPhotos() {
  if (_hydratingPhotos || !driveState.connected) return;
  _hydratingPhotos = true;
  try {
    const photos = state.checklist.photos;
    for (const itemId of Object.keys(photos)) {
      let changed = false;
      for (const ref of (photos[itemId] || [])) {
        if (ref && ref.driveId && !photoBlobCache[ref.driveId]) {
          try { await fetchPhotoBlob(ref.driveId); changed = true; }
          catch (e) { console.warn('Falha ao carregar foto', ref.driveId, e); }
        }
      }
      if (changed) renderPhotoRow(itemId);
    }
  } finally { _hydratingPhotos = false; }
}

//  PERSISTÊNCIA — local + Google Drive (dados.json único, sem fotografias)
// ════════════════════════════════════════
const SAVE_KEY = 'visita_tecnica_state_v1';

function _storage() {
  try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return localStorage; }
  catch(e) { return sessionStorage; }
}

function sessionPayloadObject() {
  // Só referências do Drive para as fotografias (nunca base64, nunca envios incompletos)
  const checklist = Object.assign({}, state.checklist, { photos: getCleanPhotosForExport() });
  return { state: Object.assign({}, state, { checklist: checklist }), activeFlow: activeFlow, ts: Date.now() };
}

function serializeSession() { return JSON.stringify(sessionPayloadObject(), null, 2); }

function markDirty() { isDirty = true; }

function saveState() {
  try {
    const obj = sessionPayloadObject();
    _storage().setItem(SAVE_KEY, JSON.stringify(obj, null, 2));
    lastLocalTs = obj.ts;
  } catch(e) {}
  markDirty();
}

function loadState() {
  try {
    const raw = _storage().getItem(SAVE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

function clearSavedState() {
  try { _storage().removeItem(SAVE_KEY); } catch(e) {}
}

// Sincroniza já (e não só no próximo ciclo de 15 s) — usado depois de enviar/apagar
// uma fotografia, para a referência não ficar só neste telemóvel.
let _syncTimer = null;
function scheduleDriveSync(ms) {
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(async function() {
    if (!isDirty || isSavingToDrive || !driveState.connected) return;
    isSavingToDrive = true;
    const ok = await saveJsonToDrive();
    isSavingToDrive = false;
    if (ok) isDirty = false;
  }, ms || 1000);
}

async function findJsonFileId() {
  if (driveState.jsonFileId) return driveState.jsonFileId;
  const q = "name='" + DRIVE_JSON_NAME + "' and '" + driveState.parentFolderId + "' in parents and trashed=false";
  const res = await driveApiFetch(DRIVE_API_FILES + '?q=' + encodeURIComponent(q) + '&fields=files(id,name)');
  if (!res.ok) throw new Error('Erro ao procurar ' + DRIVE_JSON_NAME);
  const data = await res.json();
  driveState.jsonFileId = (data.files && data.files[0]) ? data.files[0].id : null;
  return driveState.jsonFileId;
}

async function saveJsonToDrive() {
  if (!driveState.connected) return false;
  if (!state.header.idImovel && !state.header.morada) return false;
  // Só sincroniza a visita ligada ao ID/morada confirmados ao abrir a visita: enquanto o
  // ecrã inicial está a ser editado, o nome da pasta ainda não é o definitivo (evita pastas "Rua das Fl…").
  if (!state.sessionKey || buildProjectFolderName() !== state.sessionKey) return false;
  try {
    await ensureProjectFolders();
    const fileId = await findJsonFileId();
    const payload = serializeSession();
    const metadata = { name: DRIVE_JSON_NAME, mimeType: 'application/json' };
    if (!fileId) metadata.parents = [driveState.parentFolderId];
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', new Blob([payload], { type: 'application/json' }));
    const url = fileId
      ? DRIVE_UPLOAD_FILES + '/' + fileId + '?uploadType=multipart'
      : DRIVE_UPLOAD_FILES + '?uploadType=multipart&fields=id';
    const res = await driveApiFetch(url, { method: fileId ? 'PATCH' : 'POST', body: form });
    if (!res.ok) throw new Error('Falha ao gravar dados.json no Drive (' + res.status + ')');
    if (!fileId) { const data = await res.json(); driveState.jsonFileId = data.id; }
    return true;
  } catch (e) {
    console.warn('Autosave Drive falhou:', e);
    return false;
  }
}

function startAutosaveTimer() {
  stopAutosaveTimer();
  autosaveTimer = setInterval(async function() {
    if (!isDirty || isSavingToDrive || !driveState.connected) return;
    isSavingToDrive = true;
    const ok = await saveJsonToDrive();
    isSavingToDrive = false;
    if (ok) { isDirty = false; flashAutosaveIndicator(); }
  }, 15000);
}
function stopAutosaveTimer() { if (autosaveTimer) clearInterval(autosaveTimer); autosaveTimer = null; }

function flashAutosaveIndicator() {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = '☁️ Sincronizado com o Google Drive';
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1800);
}

async function loadSessionFromDrive(parentFolderId) {
  const q = "name='" + DRIVE_JSON_NAME + "' and '" + parentFolderId + "' in parents and trashed=false";
  const res = await driveApiFetch(DRIVE_API_FILES + '?q=' + encodeURIComponent(q) + '&fields=files(id,name)');
  if (!res.ok) throw new Error('Erro ao procurar sessão no Drive (' + res.status + ')');
  const data = await res.json();
  const file = data.files && data.files[0];
  if (!file) return null;
  driveState.jsonFileId = file.id;
  const dl = await driveApiFetch(DRIVE_API_FILES + '/' + file.id + '?alt=media');
  if (!dl.ok) throw new Error('Erro ao obter dados.json (' + dl.status + ')');
  return await dl.json();
}

function exportSessionFile() {
  const payload = serializeSession();
  const blob = new Blob([payload], { type: 'application/json' });
  const id = String(state.header.idImovel || 'visita-tecnica').replace(/[^\w-]+/g, '_');
  const fname = 'sessao_' + id + '_' + new Date().toISOString().slice(0,10) + '.json';
  if (IS_NATIVE) {
    // WebView não descarrega blobs: grava em cache e abre a partilha do Android
    saveBlobLocallyNative(blob, fname).then(function() {
      showToast('Sessão guardada como ficheiro JSON.');
    }).catch(function(e) {
      if (!isNativeShareCancel(e)) showToast('Não foi possível guardar o ficheiro.');
    });
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fname;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Sessão guardada como ficheiro JSON.');
}

function importSessionFile(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.state) throw new Error('Formato inválido');
      state = normalizeState(data.state);
      if (!state.sessionKey) state.sessionKey = buildProjectFolderName();
      activeFlow = data.activeFlow || null;
      driveState.sessionLoadedFor = null;
      fillHeaderInputs();
      saveState();   // lastLocalTs = agora → esta cópia prevalece sobre o Drive
      showToast('Sessão retomada com sucesso!');
      if (activeFlow === 'checklist') goToChecklist(); else if (activeFlow === 'premissas') goToPremissas();
    } catch(err) {
      alert('Erro ao importar sessão: ' + err.message);
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderChoiceGroup(containerId, options, currentValue, onSelect) {
  const el = document.getElementById(containerId);
  el.innerHTML = options.map(function(opt) {
    const active = currentValue === opt ? ' active' : '';
    return `<button type="button" class="choice-btn${active}" data-val="${escapeHtml(opt)}">${escapeHtml(opt)}</button>`;
  }).join('');
  Array.from(el.children).forEach(function(btn, i) {
    btn.onclick = function() { onSelect(options[i]); };
  });
}

function renderHomeChoices() {
  renderChoiceGroup('grp-gama', GAMA_OPTIONS, state.header.gama, function(val) {
    state.header.gama = (state.header.gama === val) ? '' : val;
    renderHomeChoices();
    saveState();
  });
  renderChoiceGroup('grp-tipologia', TIPOLOGIA_OPTIONS, state.header.tipologia, function(val) {
    state.header.tipologia = (state.header.tipologia === val) ? '' : val;
    renderHomeChoices();
    saveState();
  });
}

function readHeaderInputs() {
  state.header.idImovel = document.getElementById('f-idimovel').value.trim();
  state.header.morada = document.getElementById('f-morada').value.trim();
  state.header.cp = document.getElementById('f-cp').value.trim();
  state.header.concelho = document.getElementById('f-concelho').value.trim();
  state.header.area = document.getElementById('f-area').value.trim();
}

function fillHeaderInputs() {
  document.getElementById('f-idimovel').value = state.header.idImovel || '';
  document.getElementById('f-morada').value = state.header.morada || '';
  document.getElementById('f-cp').value = state.header.cp || '';
  document.getElementById('f-concelho').value = state.header.concelho || '';
  document.getElementById('f-area').value = state.header.area || '';

}

function bindHeaderInputListeners() {
  ['f-idimovel','f-morada','f-cp','f-concelho','f-area'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', function() { readHeaderInputs(); saveState(); });
  });
}

function headerSummaryText() {
  const h = state.header;
  return [h.idImovel, h.morada].filter(Boolean).join(' · ') || 'Sem identificação';
}

function updateAppHeaders() {
  const summary = headerSummaryText();
  const clSub = document.getElementById('cl-hdr-subtitle');
  const pfSub = document.getElementById('pf-hdr-subtitle');
  if (clSub) clSub.textContent = summary;
  if (pfSub) pfSub.textContent = summary;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// ── Indicador de espera (só aparece se a operação demorar > 250 ms) ──
let _loadingTimer = null;
function showLoading(msg) {
  const el = document.getElementById('loading-overlay');
  document.getElementById('loading-text').textContent = msg || 'A carregar…';
  clearTimeout(_loadingTimer);
  _loadingTimer = setTimeout(function() { el.classList.add('open'); }, 250);
}
function hideLoading() {
  clearTimeout(_loadingTimer);
  document.getElementById('loading-overlay').classList.remove('open');
}

function resetDriveFolderCache() {
  driveState.parentFolderId = null;
  driveState.photosFolderId = null;
  driveState.sectionFolderIds = {};
  driveState.projectFolderName = null;
  driveState.jsonFileId = null;
  driveState.sessionLoadedFor = null;
}

// Começar uma visita nova: apaga respostas/fotos do ecrã (o Drive da visita anterior não é tocado)
function resetVisitData() {
  revokePhotoCaches();
  state.checklist = { answers:{}, obs:{}, photos:{} };
  state.premissas = { answers:{} };
  state.sessionKey = null;
  resetDriveFolderCache();
}

function shouldAdoptDriveData(d) {
  if (!sessionHasData()) return true;               // nada local a perder
  return (d.ts || 0) > (lastLocalTs || 0);           // só se o Drive for mais recente que a cópia local
}

function adoptSessionData(d) {
  const incoming = normalizeState(d.state);
  const h = state.header, ih = incoming.header || {};
  Object.keys(ih).forEach(function(k) { if (!h[k] && ih[k]) h[k] = ih[k]; });   // o que está escrito no ecrã prevalece
  incoming.header = h;
  incoming.sessionKey = state.sessionKey;
  state = incoming;
  fillHeaderInputs();
}

// Liga as respostas ao imóvel indicado no ecrã inicial: nunca mistura dois imóveis
// e, com o Drive ligado, retoma a visita já iniciada (na PWA ou noutro telemóvel).
let _noDriveToastShown = false;
async function bindSessionToHeader() {
  const key = buildProjectFolderName();                 // null se ID e morada estão vazios
  if (key && state.sessionKey && state.sessionKey !== key && sessionHasData()) {
    const novaVisita = confirm('O ID ou a morada mudaram:\n• Antes: ' + state.sessionKey + '\n• Agora: ' + key +
      '\n\nOK = começar uma visita NOVA (as respostas e fotografias atuais deixam de aparecer aqui; ficam guardadas no Drive da visita anterior).' +
      '\nCancelar = manter as respostas atuais e só atualizar o ID/morada.');
    if (novaVisita) resetVisitData();
  }
  if (key) state.sessionKey = key;
  showLoading('A preparar a visita…');
  try {
    await nativeSilentConnect(6000);
    if (driveState.connected && key && driveState.sessionLoadedFor !== key) {
      await ensureProjectFolders();
      const driveData = await loadSessionFromDrive(driveState.parentFolderId);
      driveState.sessionLoadedFor = key;
      if (driveData && driveData.state && shouldAdoptDriveData(driveData)) {
        adoptSessionData(driveData);
        showToast('Sessão carregada do Google Drive.');
      }
    } else if (key && !driveState.connected && !_noDriveToastShown) {
      _noDriveToastShown = true;
      showToast('Drive desligado — liga o Drive para guardar a sessão e as fotografias na nuvem.');
    }
  } catch (e) {
    console.warn('Sincronização com o Drive ao abrir a visita:', e);
    showToast('Não foi possível ler o Drive agora — a continuar com os dados locais.');
  } finally { hideLoading(); }
}

let _enteringFlow = false;
async function enterFlow(flow) {
  if (_enteringFlow) return;          // evita duplo toque enquanto o Drive responde
  _enteringFlow = true;
  try {
    readHeaderInputs();
    await bindSessionToHeader();
    activeFlow = flow;
    updateAppHeaders();
    if (flow === 'checklist') { renderChecklist(); showScreen('checklist-screen'); }
    else { renderPremissas(); showScreen('premissas-screen'); }
    saveState();
    if (flow === 'checklist') hydrateChecklistPhotos();
  } finally { _enteringFlow = false; }
}

function goToChecklist() { return enterFlow('checklist'); }
function goToPremissas() { return enterFlow('premissas'); }

function goHome() {
  activeFlow = null;
  saveState();
  showScreen('home-screen');
}

function clearAllData() {
  if (!confirm('Limpar todos os dados desta sessão neste telemóvel?\n(O que já está no Google Drive não é apagado.)\nEsta ação não pode ser desfeita.')) return;
  revokePhotoCaches();
  state = newEmptyState();
  activeFlow = null;
  resetDriveFolderCache();
  clearSavedState();
  fillHeaderInputs();
  showToast('Dados limpos.');
}

// ════════════════════════════════════════
//  CHECKLIST — Visita Técnica
// ════════════════════════════════════════
const OPT_LABELS = { sim:'Sim', parcial:'Parcial', nao:'Não', na:'NA' };
const OPT_KEYS = ['sim','parcial','nao','na'];

function checklistItemId(secId, idx) { return secId + '_' + idx; }

function renderChecklist() {
  const wrap = document.getElementById('cl-sections-wrap');
  wrap.innerHTML = CHECKLIST_SECTIONS.map(function(sec) {
    const itemsHtml = sec.items.map(function(label, idx) {
      return renderChecklistItemHtml(checklistItemId(sec.id, idx), label);
    }).join('');
    return `<div class="section-block" id="clsec-${sec.id}">
      <div class="section-header" onclick="toggleSection('clsec-${sec.id}')">
        <div class="section-icon">${sec.icon}</div>
        <div class="section-name-wrap"><div class="section-name">${sec.name}</div>
          <div class="section-meta" id="clmeta-${sec.id}"></div></div>
        <button type="button" class="section-na-btn" onclick="event.stopPropagation(); bulkSetSectionNA('${sec.id}')">NA secção</button>
        <div class="section-chevron">▾</div>
      </div>
      <div class="section-body">${itemsHtml}</div>
    </div>`;
  }).join('');
  hydrateChecklistUI();
}

function renderChecklistItemHtml(id, label) {
  const optsHtml = OPT_KEYS.map(function(k) {
    return `<button type="button" class="opt-btn" id="clopt-${id}-${k}" onclick="setChecklistAnswer('${id}','${k}')">${OPT_LABELS[k]}</button>`;
  }).join('');
  return `<div class="item-card" id="clic-${id}">
    <div class="item-q">${escapeHtml(label)}</div>
    <div class="item-options">${optsHtml}</div>
    <input type="text" class="item-free-input" id="clfree-${id}" placeholder="ou escreve a resposta (ex: 3,00m)" oninput="setChecklistFreeText('${id}', this.value)">
    <div class="item-actions">
      <button type="button" class="item-act-btn" id="clobstoggle-${id}" onclick="toggleChecklistObs('${id}')">💬 Observações</button>
      <button type="button" class="item-act-btn" id="clphotobtn-${id}" onclick="addPhoto('${id}')">📷 Foto</button>
    </div>
    <div class="photo-row" id="clphotorow-${id}"></div>
    <div class="item-obs-wrap" id="clobswrap-${id}"><textarea class="item-obs-area" id="clobs-${id}" placeholder="Observações…" oninput="setChecklistObs('${id}', this.value)"></textarea></div>
  </div>`;
}

function refreshChecklistItemUI(id) {
  const val = state.checklist.answers[id] || '';
  const card = document.getElementById('clic-' + id);
  const freeInput = document.getElementById('clfree-' + id);
  OPT_KEYS.forEach(function(k) {
    const btn = document.getElementById('clopt-' + id + '-' + k);
    if (btn) btn.classList.toggle('active-' + k, val === k);
  });
  const isCanon = OPT_KEYS.indexOf(val) !== -1;
  if (card) card.classList.toggle('answered-livre', !!val && !isCanon);
  if (freeInput) {
    if (!isCanon) freeInput.value = val;
    else if (document.activeElement !== freeInput) freeInput.value = '';
    freeInput.classList.toggle('has-value', !!val && !isCanon);
  }
}

function setChecklistAnswer(id, val) {
  const cur = state.checklist.answers[id];
  const next = (cur === val) ? '' : val;
  state.checklist.answers[id] = next;
  refreshChecklistItemUI(id);
  updateChecklistProgress();
  saveState();
}

function setChecklistFreeText(id, text) {
  state.checklist.answers[id] = text;
  refreshChecklistItemUI(id);
  updateChecklistProgress();
  saveState();
}

function toggleChecklistObs(id) {
  const wrap = document.getElementById('clobswrap-' + id);
  if (wrap) wrap.classList.toggle('open');
}

function updateObsButton(id) {
  const t = document.getElementById('clobstoggle-' + id);
  if (!t) return;
  const has = !!state.checklist.obs[id];
  t.classList.toggle('has', has);
  t.textContent = has ? '💬 Observações ✓' : '💬 Observações';
}

function setChecklistObs(id, text) {
  state.checklist.obs[id] = text;
  updateObsButton(id);
  saveState();
}

function bulkSetSectionNA(secId) {
  const sec = CHECKLIST_SECTIONS.find(function(s) { return s.id === secId; });
  if (!sec) return;
  sec.items.forEach(function(_, idx) {
    const id = checklistItemId(secId, idx);
    state.checklist.answers[id] = 'na';
    refreshChecklistItemUI(id);
  });
  updateChecklistProgress();
  saveState();
  showToast('Secção marcada como NA.');
}

function updateChecklistProgress() {
  let total = 0, done = 0;
  CHECKLIST_SECTIONS.forEach(function(sec) {
    let secTotal = 0, secDone = 0;
    sec.items.forEach(function(_, idx) {
      secTotal++; total++;
      if (state.checklist.answers[checklistItemId(sec.id, idx)]) { secDone++; done++; }
    });
    const meta = document.getElementById('clmeta-' + sec.id);
    if (meta) { meta.textContent = secDone + ' / ' + secTotal; meta.classList.toggle('done', secDone === secTotal); }
  });
  const fill = document.getElementById('cl-progress-fill');
  const label = document.getElementById('cl-progress-label');
  if (fill) fill.style.width = (total ? (done/total*100) : 0) + '%';
  if (label) label.textContent = done + ' / ' + total + ' respondidas';
}

function hydrateChecklistUI() {
  CHECKLIST_SECTIONS.forEach(function(sec) {
    sec.items.forEach(function(_, idx) {
      const id = checklistItemId(sec.id, idx);
      refreshChecklistItemUI(id);
      const area = document.getElementById('clobs-' + id);
      if (area) area.value = state.checklist.obs[id] || '';
      updateObsButton(id);
      renderPhotoRow(id);
    });
  });
  updateChecklistProgress();
}

function addPhoto(itemId) {

async function handlePhotos(event) {
  const files = Array.from(event.target.files || []);
  event.target.value = '';
  const id = currentPhotoItemId;
  if (!id || !files.length) return;
  await processPhotoFiles(files, id);
}

let _tempPhotoCounter = 0;
async function processPhotoFiles(files, id) {
  try {
    if (!state.checklist.photos[id]) state.checklist.photos[id] = [];
    for (const file of files) {
      if (!/^image\//.test(file.type || 'image/jpeg')) continue;
      const tempKey = 'pending_' + Date.now() + '_' + (++_tempPhotoCounter);

      // Miniatura gerada JÁ AQUI, antes do envio: guardar fotos em resolução de
      // câmara em memória é o que mais facilmente esgota o WebView.
      const rawPreviewUrl = URL.createObjectURL(file);
      try {
        photoBlobCache[tempKey] = await downscaleImageToObjectUrl(rawPreviewUrl, PHOTO_THUMB_MAX_DIM);
        URL.revokeObjectURL(rawPreviewUrl);
      } catch (e) {
        photoBlobCache[tempKey] = rawPreviewUrl;
      }

      const entry = { driveId: null, tempKey: tempKey, name: file.name, mimeType: file.type, status: 'uploading' };
      state.checklist.photos[id].push(entry);
      renderPhotoRow(id);
      await uploadEntry(entry, file, id);
    }
  } catch (err) {
    console.error('Erro inesperado ao processar fotografias:', err);
    showToast('Ocorreu um problema ao processar a fotografia — tenta novamente.');
  }
}

// Envia uma fotografia (já com miniatura) para a pasta da secção no Drive.
// Se falhar (sem rede, Drive desligado), fica com "!" e basta tocar nela para reenviar.
async function uploadEntry(entry, file, id) {
  if (!driveState.connected) {
    entry.status = 'failed';
    entry._file = file;
    renderPhotoRow(id);
    showToast('Drive desligado — liga o Drive e toca na fotografia com "!" para a enviar.');
    return;
  }
  entry.status = 'uploading';
  renderPhotoRow(id);
  try {
    const uploaded = await uploadPhotoToDrive(file, id);
    const oldKey = entry.tempKey;
    if (oldKey && photoBlobCache[oldKey]) { photoBlobCache[uploaded.driveId] = photoBlobCache[oldKey]; delete photoBlobCache[oldKey]; }
    entry.driveId = uploaded.driveId;
    entry.name = uploaded.name;
    entry.mimeType = uploaded.mimeType;
    entry.status = 'done';
    delete entry.tempKey;
    delete entry._file;
    saveState();    // grava a nova referência (só driveId) na cópia local
    scheduleDriveSync(1000);   // e no Drive (dados.json) quase de imediato
  } catch (err) {
    console.warn('Falha ao enviar foto:', err);
    entry.status = 'failed';
    entry._file = file;
    showToast('Falha ao enviar fotografia — toca nela para reenviar.');
  }
  renderPhotoRow(id);
}

function updatePhotoButton(id) {
  const b = document.getElementById('clphotobtn-' + id);
  if (!b) return;
  const n = (state.checklist.photos[id] || []).length;
  b.classList.toggle('has', n > 0);
  b.textContent = n ? '📷 Fotos (' + n + ')' : '📷 Foto';
}

function renderPhotoRow(id) {
  const row = document.getElementById('clphotorow-' + id);
  if (!row) return;
  row.innerHTML = '';
  (state.checklist.photos[id] || []).forEach(function(entry, idx) {
    const key = entry.driveId || entry.tempKey;
    const src = photoBlobCache[key] || '';
    const wrap = document.createElement('div');
    wrap.className = 'photo-thumb-wrap' +
      (entry.status === 'uploading' ? ' is-uploading' : '') +
      (entry.status === 'failed' ? ' is-failed' : '');

    let thumb;
    if (src) {
      thumb = document.createElement('img');
      thumb.className = 'photo-thumb';
      thumb.src = src;
      thumb.alt = '';
    } else {
      thumb = document.createElement('div');
      thumb.className = 'photo-thumb ph';
      thumb.textContent = '📷';
    }
    thumb.onclick = function() {
      if (entry.status === 'failed' && entry._file) { uploadEntry(entry, entry._file, id); return; }
      if (src || entry.driveId) openPhotoEntry(entry, src);
    };
    wrap.appendChild(thumb);

    const spinner = document.createElement('div');
    spinner.className = 'photo-spinner';
    spinner.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-opacity="0.3"/><path d="M21 12a9 9 0 0 0-9-9"/></svg>';
    wrap.appendChild(spinner);

    const failBadge = document.createElement('div');
    failBadge.className = 'photo-fail-badge';
    failBadge.textContent = '!';
    wrap.appendChild(failBadge);

    // Botão × para apagar — no Android (sem hover) aparece ao tocar na miniatura
    const delBtn = document.createElement('div');
    delBtn.className = 'photo-delete-btn';
    delBtn.textContent = '×';
    delBtn.title = 'Apagar fotografia';
    delBtn.onclick = function(e) { e.stopPropagation(); removePhoto(id, idx); };
    wrap.appendChild(delBtn);

    thumb.addEventListener('touchend', function(e) {
      const isVisible = wrap.classList.contains('show-delete');
      document.querySelectorAll('.photo-thumb-wrap.show-delete').forEach(function(w) { w.classList.remove('show-delete'); });
      if (!isVisible && entry.status !== 'failed') {
        e.preventDefault();               // não abrir a foto se ainda estava a mostrar o ×
        wrap.classList.add('show-delete');
      }
    }, { passive: false });

    row.appendChild(wrap);
  });
  updatePhotoButton(id);
}

let _viewerToken = 0;
let _viewerObjectUrl = null;
function openPhotoEntry(entry, thumbSrc) {
  const img = document.getElementById('photo-modal-img');
  const myToken = ++_viewerToken;
  if (_viewerObjectUrl) { URL.revokeObjectURL(_viewerObjectUrl); _viewerObjectUrl = null; }
  img.src = thumbSrc || '';
  document.getElementById('photo-modal').classList.add('open');
  // mostra logo a miniatura e troca pela fotografia completa quando chegar do Drive
  if (entry.driveId && driveState.connected) {
    fetchPhotoFullBlob(entry.driveId).then(function(blob) {
      if (myToken !== _viewerToken) return;          // entretanto fechou ou abriu outra
      _viewerObjectUrl = URL.createObjectURL(blob);
      img.src = _viewerObjectUrl;
    }).catch(function(e) { console.warn('Fotografia completa indisponível:', e); });
  }
}
function closePhoto() {
  _viewerToken++;
  document.getElementById('photo-modal').classList.remove('open');
  document.getElementById('photo-modal-img').removeAttribute('src');
  if (_viewerObjectUrl) { URL.revokeObjectURL(_viewerObjectUrl); _viewerObjectUrl = null; }
}

async function removePhoto(itemId, idx) {
  const photos = state.checklist.photos[itemId];
  if (!photos || !photos[idx]) return;
  const entry = photos[idx];
  if (entry.status === 'uploading') return;        // não apagar enquanto ainda está a enviar

  const driveId = entry.driveId;
  const key = driveId || entry.tempKey;
  if (key && photoBlobCache[key]) { URL.revokeObjectURL(photoBlobCache[key]); delete photoBlobCache[key]; }
  if (driveId) delete pdfPhotoCache[driveId];
  photos.splice(idx, 1);
  if (!photos.length) delete state.checklist.photos[itemId];
  saveState();
  scheduleDriveSync(1000);
  renderPhotoRow(itemId);

  // Apagar no Drive em segundo plano — sem bloquear o ecrã
  if (driveId && driveState.connected) {
    driveApiFetch(DRIVE_API_FILES + '/' + driveId, { method: 'DELETE' }).catch(function(e) {
      console.warn('Não foi possível apagar a foto no Drive:', e);
    });
  }
}

// ════════════════════════════════════════
//  APK — câmara nativa, recuperação após o Android fechar a app, botão "voltar"
// ════════════════════════════════════════
const PENDING_PHOTO_KEY = 'visita_tecnica_pending_photo_v1';
let _appReadyResolve = function() {};
const appReady = new Promise(function(resolve) { _appReadyResolve = resolve; });

// Antes de abrir a câmara guarda-se para que item é a foto: se o Android
// fechar a app enquanto a câmara está aberta, é isto que permite colocá-la
// no sítio certo quando a app voltar (ver onNativeRestoredResult).
function setPendingPhoto(itemId) {
  try { _storage().setItem(PENDING_PHOTO_KEY, JSON.stringify({ itemId: itemId, ts: Date.now() })); } catch (e) {}
}
function takePendingPhoto() {
  let p = null;
  try {
    p = JSON.parse(_storage().getItem(PENDING_PHOTO_KEY) || 'null');
    _storage().removeItem(PENDING_PHOTO_KEY);
  } catch (e) {}
  if (p && p.ts && Date.now() - p.ts > 3600 * 1000) return null; // marcador antigo = lixo
  return p;
}

async function takeNativePhoto() {
  const api = await nativeReady;
  if (!api) { showToast('Câmara nativa indisponível.'); return; }
  const itemId = currentPhotoItemId;
  setPendingPhoto(itemId);
  saveState();     // o Android pode fechar a app enquanto a câmara está aberta: grava já o estado
  let photo;
  try {
    photo = await api.Camera.getPhoto({
      resultType: api.CameraResultType.Uri,
      source: api.CameraSource.Camera,
      quality: 90,
      saveToGallery: false,
      correctOrientation: true,
    });
  } catch (err) {
    takePendingPhoto(); // limpa o marcador
    const msg = String((err && (err.message || err)) || '');
    if (!/cancel/i.test(msg)) {
      console.warn('Camera.getPhoto falhou:', err);
      showToast('Não foi possível tirar a fotografia.');
    }
    return;
  }
  takePendingPhoto();
  try {
    await ingestNativePhoto(photo, itemId);
  } catch (err) {
    console.error('Erro ao processar a fotografia nativa:', err);
    showToast('Ocorreu um problema ao processar a fotografia — tenta novamente.');
  }
}

// Lê o ficheiro que a câmara nativa gravou e entrega-o ao mesmo circuito das
// fotografias da galeria (miniatura → Drive → estado).
async function ingestNativePhoto(photo, itemId) {
  const src = photo && (photo.webPath || (photo.path && window.Capacitor.convertFileSrc(photo.path)));
  if (!src) throw new Error('A câmara não devolveu o caminho da fotografia.');
  const resp = await fetch(src);
  if (!resp.ok) throw new Error('Não foi possível ler a fotografia (' + resp.status + ').');
  const blob = await resp.blob();
  const file = new File([blob], 'IMG_' + Date.now() + '.jpg', { type: blob.type || 'image/jpeg' });
  await processPhotoFiles([file], itemId);
}

// O Android fechou a app enquanto a câmara estava aberta: o Capacitor guarda
// o resultado e entrega-o aqui no arranque seguinte.
function onNativeRestoredResult(ev) {
  try {
    if (!ev || ev.pluginId !== 'Camera') return;
    const pending = takePendingPhoto();
    const data = ev.data || {};
    if (!ev.success || !(data.webPath || data.path)) return; // cancelada ou falhada
    if (!pending || !pending.itemId) {
      showToast('Fotografia recuperada, mas sem destino — tira-a novamente.');
      return;
    }
    currentPhotoItemId = pending.itemId;
    appReady.then(function() {
      return ingestNativePhoto(data, pending.itemId);
    }).then(function() {
      showToast('Fotografia recuperada depois de o Android fechar a app.');
    }).catch(function(err) {
      console.error('Falha ao recuperar a fotografia:', err);
      showToast('Não foi possível recuperar a fotografia — tira-a novamente.');
    });
  } catch (e) { console.error(e); }
}

// Botão "voltar" do Android: fecha o que estiver aberto; dentro da visita/premissas
// volta ao ecrã inicial (como o botão "Voltar"); no ecrã inicial exige um segundo
// toque em 2 s para sair (evita fechar a app sem querer em obra).
let _lastBackPress = 0;
function onNativeBackButton() {
  const viewer = document.getElementById('photo-modal');
  if (viewer && viewer.classList.contains('open')) { closePhoto(); return; }
  const psm = document.getElementById('photo-source-modal');
  if (psm && psm.style.display === 'flex') { psm.style.display = 'none'; return; }
  if (activeFlow) { goHome(); return; }
  const now = Date.now();
  if (now - _lastBackPress < 2000) {
    if (nativeAPI) nativeAPI.App.exitApp();
    return;
  }
  _lastBackPress = now;
  showToast('Prime novamente para sair.');
}

// Guardar um ficheiro (PDF/JSON) quando não há Drive: o WebView não descarrega
// blobs, por isso grava-se em cache e abre-se a partilha do Android
// ("Guardar em Ficheiros", WhatsApp, e-mail, ...).
async function saveBlobLocallyNative(blob, filename) {
  const api = await nativeReady;
  if (!api) throw new Error('Plugins nativos indisponíveis.');
  const safeName = String(filename).replace(/[^\w.\-]+/g, '_');
  const dataUrl = await blobToDataUrl(blob);
  const base64 = String(dataUrl).split(',')[1] || '';
  const written = await api.Filesystem.writeFile({ path: safeName, data: base64, directory: api.Directory.Cache });
  await api.Share.share({ title: safeName, files: [written.uri], dialogTitle: 'Guardar ou partilhar' });
}
function isNativeShareCancel(err) {
  return /cancel/i.test(String((err && (err.message || err)) || ''));
}

function setupNativeBridge(api) {
  try { api.App.addListener('appRestoredResult', onNativeRestoredResult).catch(function() {}); } catch (e) { console.warn(e); }
  try { api.App.addListener('backButton', onNativeBackButton).catch(function() {}); } catch (e) { console.warn(e); }
  // as fotografias originais da câmara ficam na pasta da app — apagar as com mais de 24 h
  try { api.DriveAuth.cleanupPhotos({ olderThanHours: 24 }).catch(function() {}); } catch (e) {}
}
nativeReady.then(function(api) { if (api) setupNativeBridge(api); });

//  PDF — primitivas partilhadas (reaproveitadas da Vistoria Final de Obra)
// ════════════════════════════════════════
const PDF_GREEN = [64, 96, 83];
const PDF_GREY  = [107, 122, 141];

function pdfRequireLib() {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    showToast('A biblioteca de geração de PDF não carregou — verifica a ligação à internet e tenta novamente.');
    return null;
  }
  return window.jspdf.jsPDF;
}

function pdfNewContext(title, ref) {
  const jsPDF = pdfRequireLib();
  if (!jsPDF) return null;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const ctx = {
    doc: doc,
    pageW: doc.internal.pageSize.getWidth(),
    pageH: doc.internal.pageSize.getHeight(),
    marginL: 14, marginR: 14, marginTop: 17, marginBottom: 14,
    title: title, ref: ref || '',
    page: 1,
  };
  ctx.contentW = ctx.pageW - ctx.marginL - ctx.marginR;
  ctx.y = ctx.marginTop;
  pdfDrawChrome(ctx);
  return ctx;
}

function pdfDrawChrome(ctx) {
  const doc = ctx.doc;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
  doc.setTextColor(PDF_GREEN[0], PDF_GREEN[1], PDF_GREEN[2]);
  doc.text(ctx.title, ctx.marginL, 10);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  doc.setTextColor(PDF_GREY[0], PDF_GREY[1], PDF_GREY[2]);
  doc.text(ctx.ref, ctx.pageW - ctx.marginR, 10, { align: 'right' });
  doc.setDrawColor(225, 228, 232);
  doc.line(ctx.marginL, 12.5, ctx.pageW - ctx.marginR, 12.5);
}

function pdfDrawFooters(ctx) {
  const doc = ctx.doc;
  const total = doc.internal.getNumberOfPages();
  for (let p = 1; p <= total; p++) {
    doc.setPage(p);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
    doc.setTextColor(PDF_GREY[0], PDF_GREY[1], PDF_GREY[2]);
    doc.text(ctx.ref, ctx.marginL, ctx.pageH - 8);
    doc.text('Página ' + p + ' / ' + total, ctx.pageW - ctx.marginR, ctx.pageH - 8, { align: 'right' });
  }
}

function pdfNewPage(ctx) {
  ctx.doc.addPage();
  ctx.page++;
  ctx.y = ctx.marginTop;
  pdfDrawChrome(ctx);
}

function pdfEnsureSpace(ctx, neededH) {
  if (ctx.y + neededH > ctx.pageH - ctx.marginBottom) pdfNewPage(ctx);
}

async function pdfFinish(ctx, filename) {
  pdfDrawFooters(ctx);
  const blob = ctx.doc.output('blob');
  if (driveState.connected) {
    try {
      const folders = await ensureProjectFolders();
      await upsertFileInDrive(filename, blob, folders.parentFolderId, 'application/pdf');
      showToast('PDF guardado no Google Drive.');
      return;
    } catch (err) {
      console.warn('Falha ao enviar PDF para o Drive, a guardar localmente:', err);
      showToast('Não foi possível guardar no Drive — a guardar o PDF localmente.');
    }
  }
  if (IS_NATIVE) {
    // WebView não descarrega blobs: grava em cache e abre a partilha do Android
    try { await saveBlobLocallyNative(blob, filename); }
    catch (e) { if (!isNativeShareCancel(e)) showToast('Não foi possível guardar o PDF: ' + (e.message || e)); }
    return;
  }
  ctx.doc.save(filename);
}

async function upsertFileInDrive(name, blob, parentId, mimeType) {
  const q = "name='" + escapeDriveQuery(name) + "' and trashed=false and '" + (parentId || 'root') + "' in parents";
  const findRes = await driveApiFetch(DRIVE_API_FILES + '?q=' + encodeURIComponent(q) + '&fields=files(id,name)&spaces=drive');
  if (!findRes.ok) throw new Error('Erro ao procurar ficheiro no Drive (' + findRes.status + ')');
  const findData = await findRes.json();
  const existingId = (findData.files && findData.files[0]) ? findData.files[0].id : null;

  if (existingId) {
    const res = await driveApiFetch(DRIVE_UPLOAD_FILES + '/' + existingId + '?uploadType=media', {
      method: 'PATCH',
      headers: { 'Content-Type': mimeType },
      body: blob,
    });
    if (!res.ok) throw new Error('Erro ao atualizar ficheiro no Drive (' + res.status + ')');
    return res.json();
  }
  const metadata = { name: name, parents: [parentId], mimeType: mimeType };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', blob);
  const res = await driveApiFetch(DRIVE_UPLOAD_FILES + '?uploadType=multipart&fields=id,name', {
    method: 'POST',
    body: form,
  });
  if (!res.ok) throw new Error('Erro ao enviar ficheiro para o Drive (' + res.status + ')');
  return res.json();
}
