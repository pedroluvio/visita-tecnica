// ── Fotografias no PDF ──
// Converte qualquer formato de imagem (jpeg/png/webp) para um JPEG normalizado
// e devolve também a proporção largura/altura — necessária para desenhar cada
// fotografia no PDF sem a distorcer.
function normalizeImageForPdf(dataUrl, maxDim) {
  return new Promise(function(resolve) {
    if (!dataUrl) { resolve(null); return; }
    let settled = false;
    const timeoutId = setTimeout(function() {
      if (settled) return;
      settled = true;
      resolve(null); // não deixar uma foto pendurada bloquear a exportação inteira
    }, 8000);
    const img = new Image();
    img.onload = function() {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      try {
        const nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height;
        if (!nw || !nh) { resolve(null); return; }
        const scale = Math.min(1, maxDim / Math.max(nw, nh));
        const w = Math.max(1, Math.round(nw * scale)), h = Math.max(1, Math.round(nh * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const c2d = canvas.getContext('2d');
        c2d.fillStyle = '#fff'; c2d.fillRect(0, 0, w, h);
        c2d.drawImage(img, 0, 0, w, h);
        resolve({ src: canvas.toDataURL('image/jpeg', 0.82), ratio: nw / nh });
      } catch (e) { resolve(null); }
    };
    img.onerror = function() {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      resolve(null);
    };
    img.src = dataUrl;
  });
}

// Distribui fotografias em "linhas" da largura disponível, todas com a mesma
// altura-alvo (tal como o flex-wrap do ecrã). Cada foto mantém a proporção:
// se a largura for limitada por maxW, a altura encolhe em vez de deformar.
// A altura de cada linha é a da sua foto mais alta (linhas só de panorâmicas ficam baixas).
function layoutPhotoRows(photos, availW, targetH, maxW, gap) {
  const rows = [];
  let row = [], rowW = 0;
  const flush = function() {
    if (row.length) rows.push({ items: row, h: Math.max.apply(null, row.map(function(p) { return p.h; })) });
    row = []; rowW = 0;
  };
  photos.forEach(function(p) {
    const ratio = p.ratio || 1.33;
    const w = Math.min(maxW, targetH * ratio);
    const h = w / ratio;
    if (row.length && rowW + gap + w > availW) flush();
    if (row.length) rowW += gap;
    row.push({ src: p.src, w: w, h: h });
    rowW += w;
  });
  flush();
  return { rows: rows, gap: gap };
}

// Desenha as linhas de fotografias, passando para a página seguinte quando uma
// linha não cabe (um item com muitas fotos nunca sai da folha).
function drawPhotoRowsPaginated(ctx, layout) {
  layout.rows.forEach(function(row, ri) {
    if (ri > 0) pdfEnsureSpace(ctx, row.h);              // a 1.ª linha já foi garantida pelo chamador
    let curX = ctx.marginL;
    row.items.forEach(function(ph) {
      try { ctx.doc.addImage(ph.src, 'JPEG', curX, ctx.y + (row.h - ph.h) / 2, ph.w, ph.h); } catch (e) { /* foto corrompida: não interrompe o PDF */ }
      curX += ph.w + layout.gap;
    });
    ctx.y += row.h + layout.gap;
  });
  ctx.y -= layout.gap;
}

// Prepara (uma a uma, por causa da memória) as fotografias para o PDF:
// descarrega do Drive, reduz para ~1100 px e guarda o resultado em cache.
async function preparePdfPhotos(onProgress) {
  const entries = [];
  Object.keys(state.checklist.photos).forEach(function(itemId) {
    (state.checklist.photos[itemId] || []).forEach(function(e) { if (e && (e.driveId || e.tempKey)) entries.push(e); });
  });
  const map = {};
  let done = 0, failed = 0;
  for (const entry of entries) {
    const key = entry.driveId || entry.tempKey;
    try {
      if (entry.driveId && pdfPhotoCache[entry.driveId]) {
        map[key] = pdfPhotoCache[entry.driveId];
      } else {
        const dataUrl = await resolvePhotoDataUrl(entry);
        if (dataUrl) {
          const norm = await normalizeImageForPdf(dataUrl, 1100);
          if (norm) { map[key] = norm; if (entry.driveId) pdfPhotoCache[entry.driveId] = norm; }
        }
      }
    } catch (e) { console.warn('Foto não pôde ser incluída no PDF:', e); }
    if (!map[key]) failed++;
    done++;
    if (onProgress) onProgress(done, entries.length);
  }
  return { map: map, failed: failed, total: entries.length };
}

function photosForItem(itemId, photoMap) {
  return (state.checklist.photos[itemId] || []).map(function(p) { return photoMap[p.driveId || p.tempKey]; }).filter(Boolean);
}

function drawChecklistItemPdf(ctx, label, val, obs, photos) {
  const doc = ctx.doc;
  const isCanon = OPT_KEYS.indexOf(val) !== -1;
  const isFree = !!val && !isCanon;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.3);
  const qLines = doc.splitTextToSize(label, isCanon ? ctx.contentW - 34 : ctx.contentW);
  const qLh = pdfLineHeight(doc);

  let freeLines = [], freeLh = 0;
  if (isFree) {
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    freeLines = doc.splitTextToSize('Resposta: ' + val, ctx.contentW);
    freeLh = pdfLineHeight(doc);
  }
  let obsLines = [], obsLh = 0;
  if (obs) {
    doc.setFont('helvetica','italic'); doc.setFontSize(8.3);
    obsLines = doc.splitTextToSize('Obs: ' + obs, ctx.contentW - 4);
    obsLh = pdfLineHeight(doc);
  }
  const photoLayout = (photos && photos.length) ? layoutPhotoRows(photos, ctx.contentW, 34, 44, 3) : null;
  const qBlockH = Math.max(qLines.length*qLh, 6);
  const freeBlockH = isFree ? freeLines.length*freeLh + 2 : 0;
  const obsBlockH = obs ? obsLines.length*obsLh + 2 : 0;
  const firstPhotoH = photoLayout ? photoLayout.rows[0].h + 2 : 0;       // garante pelo menos a 1.ª linha de fotos na mesma página
  const blockH = qBlockH + freeBlockH + obsBlockH + firstPhotoH + 5;
  pdfEnsureSpace(ctx, blockH);

  const startY = ctx.y;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.3); doc.setTextColor(26,35,50);
  doc.text(qLines, ctx.marginL, ctx.y + qLh*0.75);

  if (isCanon) {
    const badge = pdfBadgeInfo(val);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
    const badgeW = Math.max(doc.getTextWidth(badge.label)+6, 16);
    doc.setFillColor(badge.bg[0],badge.bg[1],badge.bg[2]);
    doc.roundedRect(ctx.pageW - ctx.marginR - badgeW, startY - 0.5, badgeW, 5.5, 1.3, 1.3, 'F');
    doc.setTextColor(badge.fg[0],badge.fg[1],badge.fg[2]);
    doc.text(badge.label, ctx.pageW - ctx.marginR - badgeW/2, startY + 3.3, { align:'center' });
  }

  ctx.y += qBlockH;
  if (isFree) {
    ctx.y += 2;
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(106,90,168);
    doc.text(freeLines, ctx.marginL, ctx.y + freeLh*0.75);
    ctx.y += freeLines.length*freeLh;
  }
  if (obs) {
    ctx.y += 2;
    doc.setFont('helvetica','italic'); doc.setFontSize(8.3); doc.setTextColor(PDF_GREY[0],PDF_GREY[1],PDF_GREY[2]);
    doc.text(obsLines, ctx.marginL, ctx.y + obsLh*0.75);
    ctx.y += obsLines.length*obsLh;
  }
  if (photoLayout) {
    ctx.y += 2;
    drawPhotoRowsPaginated(ctx, photoLayout);
  }
  ctx.y += 5;
  doc.setDrawColor(232,232,232);
  doc.line(ctx.marginL, ctx.y-2.5, ctx.pageW-ctx.marginR, ctx.y-2.5);
}

function drawChecklistSummaryBoxes(ctx, counts) {
  const doc = ctx.doc;
  const items = [
    ['Sim', counts.sim, [232,245,238],[42,122,75]],
    ['Parcial', counts.parcial, [254,243,224],[217,119,6]],
    ['Não', counts.nao, [253,236,234],[192,57,43]],
    ['NA', counts.na, [240,242,245],[107,122,141]],
    ['Livre', counts.livre, [239,236,247],[106,90,168]],
  ];
  const gap = 4;
  const boxW = (ctx.contentW - gap*(items.length-1)) / items.length;
  const boxH = 15;
  items.forEach(function(it, i) {
    const bx = ctx.marginL + i*(boxW+gap);
    doc.setFillColor(it[2][0],it[2][1],it[2][2]);
    doc.roundedRect(bx, ctx.y, boxW, boxH, 2, 2, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(it[3][0],it[3][1],it[3][2]);
    doc.text(String(it[1]), bx+boxW/2, ctx.y+8, {align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(it[3][0],it[3][1],it[3][2]);
    doc.text(it[0], bx+boxW/2, ctx.y+12.5, {align:'center'});
  });
  ctx.y += boxH + 9;
}

async function exportChecklistPDF() {

  try {
    const prep = await preparePdfPhotos(function(done, total) { btn.textContent = 'Fotos ' + done + '/' + total + '…'; });
    const photoMap = prep.map;
    if (prep.failed && !confirm(prep.failed + ' de ' + prep.total + ' fotografias não puderam ser carregadas (sem ligação ao Drive?).\n\nOK = gerar o PDF sem essas fotografias.\nCancelar = não gerar agora.')) return;
    btn.textContent = 'A gerar…';

    if (!ctx) return;
    drawHeroBand(ctx, 'Relatório de Visita Técnica');
    drawInfoStrip(ctx);

    const counts = { sim:0, parcial:0, nao:0, na:0, livre:0 };
    CHECKLIST_SECTIONS.forEach(function(sec) {
      sec.items.forEach(function(_, idx) {
        const v = state.checklist.answers[checklistItemId(sec.id, idx)] || '';
        if (OPT_KEYS.indexOf(v) !== -1) counts[v]++;
        else if (v) counts.livre++;

    CHECKLIST_SECTIONS.forEach(function(sec, si) {
      drawSectionTitlePdf(ctx, si + 1, sec.name);

      });

    });

    showToast('Erro ao gerar PDF: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}

function pfFieldDisplayValue(f) {
  const v = state.premissas.answers[f.id];
  if (f.type === 'multiselect') {
    return (Array.isArray(v) && v.length) ? v.join(', ') : '—';
  }
  if (f.type === 'allocate') {
    if (!v || !Object.keys(v).length) return '—';
    return Object.keys(v).map(function(k) { return k + ': ' + v[k]; }).join('   ·   ');
  }
  return (v !== undefined && v !== null && v !== '') ? String(v) : '—';
}

function drawPremissasFieldPdf(ctx, f) {
  if (!isFieldVisible(f)) return;
  const doc = ctx.doc;
  const val = pfFieldDisplayValue(f);
  const labelMaxW = ctx.contentW * 0.55;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.3);
  const labelLines = doc.splitTextToSize(f.label, labelMaxW);
  const lh = pdfLineHeight(doc);

  doc.setFont('helvetica','bold'); doc.setFontSize(9.3);
  const wrapValue = doc.getTextWidth(val) > (ctx.contentW - labelMaxW - 4);
  const valueLines = wrapValue ? doc.splitTextToSize(val, ctx.contentW) : [val];

  const blockH = wrapValue
    ? Math.max(labelLines.length*lh, 6) + valueLines.length*lh + 3 + 5
    : Math.max(labelLines.length*lh, 6) + 5;
  pdfEnsureSpace(ctx, blockH);

  const startY = ctx.y;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.3); doc.setTextColor(26,35,50);
  doc.text(labelLines, ctx.marginL, ctx.y + lh*0.75);

  doc.setFont('helvetica','bold'); doc.setFontSize(9.3); doc.setTextColor(PDF_GREEN[0],PDF_GREEN[1],PDF_GREEN[2]);
  if (!wrapValue) {
    doc.text(val, ctx.pageW-ctx.marginR, startY + lh*0.75, { align:'right' });
    ctx.y += Math.max(labelLines.length*lh, 6) + 5;
  } else {
    ctx.y += Math.max(labelLines.length*lh, 6) + 2;
    doc.text(valueLines, ctx.marginL, ctx.y + lh*0.75);
    ctx.y += valueLines.length*lh + 5;
  }

  if (f.type === 'allocate') {
    const list = allocateSourceList(f);
    const cur = (state.premissas.answers[f.id] && typeof state.premissas.answers[f.id] === 'object') ? state.premissas.answers[f.id] : {};
    const missing = list.filter(function(item) { return !cur[item]; });
    if (missing.length) {
      doc.setFont('helvetica','bold'); doc.setFontSize(8.3); doc.setTextColor(192,57,43);
      const warnLines = doc.splitTextToSize('Por atribuir: ' + missing.join(', '), ctx.contentW);
      pdfEnsureSpace(ctx, warnLines.length*lh + 4);
      doc.text(warnLines, ctx.marginL, ctx.y - 1.5);
      ctx.y += warnLines.length*lh + 3;
    }
  }

  doc.setDrawColor(232,232,232);
  doc.line(ctx.marginL, ctx.y-2.5, ctx.pageW-ctx.marginR, ctx.y-2.5);
}

function drawPremissasNotePdf(ctx, note) {
  const doc = ctx.doc;
  doc.setFont('helvetica','italic'); doc.setFontSize(8);
  const noteLines = doc.splitTextToSize('Nota: ' + note, ctx.contentW - 6);
  const lh = pdfLineHeight(doc);
  pdfEnsureSpace(ctx, noteLines.length*lh + 6);
  doc.setDrawColor(200,151,58); doc.setLineWidth(0.8);
  doc.line(ctx.marginL, ctx.y, ctx.marginL, ctx.y + noteLines.length*lh + 3);
  doc.setLineWidth(0.2);
  doc.setTextColor(PDF_GREY[0],PDF_GREY[1],PDF_GREY[2]);
  doc.text(noteLines, ctx.marginL + 3, ctx.y + lh*0.8);
  ctx.y += noteLines.length*lh + 7;
}

// ════════════════════════════════════════
//  PREMISSAS DE PROJETO
// ════════════════════════════════════════
function choiceKey(opt) { return opt.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,''); }

function allPremissasFields() {
  const out = [];
  PREMISSAS_SECTIONS.forEach(function(sec) {
    if (sec.groups) sec.groups.forEach(function(g) { g.fields.forEach(function(f) { out.push(f); }); });
    else sec.fields.forEach(function(f) { out.push(f); });
  });
  return out;
}

function fieldById(id) { return allPremissasFields().find(function(f) { return f.id === id; }); }

function renderPremissas() {
  const wrap = document.getElementById('pf-sections-wrap');
  wrap.innerHTML = PREMISSAS_SECTIONS.map(renderPremissasSectionHtml).join('');
  hydratePremissasUI();
}

function renderPremissasSectionHtml(sec) {
  let bodyHtml = '';
  if (sec.groups) {
    sec.groups.forEach(function(g) {
      bodyHtml += `<div class="pf-group-label">${escapeHtml(g.label)}</div>`;
      bodyHtml += g.fields.map(renderPremissasFieldHtml).join('');
    });
  } else {
    bodyHtml += sec.fields.map(renderPremissasFieldHtml).join('');
  }
  if (sec.note) bodyHtml += `<div class="pf-note">ℹ️ ${escapeHtml(sec.note)}</div>`;
  return `<div class="section-block" id="pfsec-${sec.id}">
    <div class="section-header" onclick="toggleSection('pfsec-${sec.id}')">
      <div class="section-icon">${sec.icon}</div>
      <div class="section-name-wrap"><div class="section-name">${sec.name}</div>
        <div class="section-meta" id="pfmeta-${sec.id}"></div></div>
      <div class="section-chevron">▾</div>
    </div>
    <div class="section-body">${bodyHtml}</div>
  </div>`;
}

function renderPremissasFieldHtml(f) {
  let control = '';
  if (f.type === 'choice') {
    const cols = f.options.length === 3 ? ' c3' : '';
    control = `<div class="pf-choice-row${cols}">` + f.options.map(function(opt) {
      const key = choiceKey(opt);
      return `<button type="button" class="choice-btn" id="pfchoice-${f.id}-${key}" onclick="setPremissasChoice('${f.id}','${key}')">${escapeHtml(opt)}</button>`;
    }).join('') + `</div>`;
  } else if (f.type === 'multiselect') {
    control = `<div class="pf-multiselect-row">` + f.options.map(function(opt) {
      const key = choiceKey(opt);
      return `<button type="button" class="pf-ms-btn" id="pfms-${f.id}-${key}" onclick="togglePremissasMultiselect('${f.id}','${key}')">${escapeHtml(opt)}</button>`;
    }).join('') + `</div>`;
  } else if (f.type === 'allocate') {
    control = `<div id="pfalloc-${f.id}"></div>`;
  } else if (f.type === 'text') {
    control = `<input type="text" class="pf-text-input" id="pftext-${f.id}" oninput="setPremissasText('${f.id}', this.value)" placeholder="Escreve aqui…">`;
  } else if (f.type === 'number') {
    control = `<input type="number" inputmode="numeric" class="pf-text-input" id="pftext-${f.id}" oninput="setPremissasText('${f.id}', this.value)" placeholder="0">`;
  }
  const wrapClass = f.showIf ? 'pf-conditional' : 'pf-field';
  const wrapId = f.showIf ? ` id="pfcond-${f.id}"` : '';
  return `<div class="${wrapClass}"${wrapId}>
    <div class="pf-label">${escapeHtml(f.label)}</div>${control}
  </div>`;
}

// ── choice (single-select exclusive) ──
function setPremissasChoice(id, key) {
  const field = fieldById(id);
  if (!field) return;
  const opt = field.options.find(function(o) { return choiceKey(o) === key; });
  const cur = state.premissas.answers[id];
  state.premissas.answers[id] = (cur === opt) ? '' : opt;
  refreshPremissasChoiceUI(id);
  refreshConditionalVisibility(id);
  updatePremissasProgress();
  saveState();
}

function refreshPremissasChoiceUI(id) {
  const field = fieldById(id);
  if (!field) return;
  const val = state.premissas.answers[id] || '';
  field.options.forEach(function(opt) {
    const key = choiceKey(opt);
    const btn = document.getElementById('pfchoice-' + id + '-' + key);
    if (btn) btn.classList.toggle('active', val === opt);
  });
}

// ── multiselect (non-exclusive, N options) ──
function togglePremissasMultiselect(id, key) {
  const field = fieldById(id);
  if (!field) return;
  const opt = field.options.find(function(o) { return choiceKey(o) === key; });
  if (!opt) return;
  let cur = Array.isArray(state.premissas.answers[id]) ? state.premissas.answers[id].slice() : [];
  const idx = cur.indexOf(opt);
  if (idx === -1) cur.push(opt); else cur.splice(idx, 1);
  state.premissas.answers[id] = cur;
  refreshMultiselectUI(id);
  refreshConditionalVisibility(id);
  refreshAllocateFieldsDependingOn(id);
  updatePremissasProgress();
  saveState();
}

function refreshMultiselectUI(id) {
  const field = fieldById(id);
  if (!field) return;
  const cur = Array.isArray(state.premissas.answers[id]) ? state.premissas.answers[id] : [];
  field.options.forEach(function(opt) {
    const key = choiceKey(opt);
    const btn = document.getElementById('pfms-' + id + '-' + key);
    if (!btn) return;
    btn.classList.remove('active', 'active-sim', 'active-nao');
    if (cur.indexOf(opt) !== -1) {
      if (opt === 'Sim') btn.classList.add('active-sim');
      else if (opt === 'Não') btn.classList.add('active-nao');
      else btn.classList.add('active');
    }
  });
}

// ── allocate (dynamic per-item bucket assignment, e.g. encastre/livre) ──
function allocateSourceList(f) {
  if (f.sourceGateField) {
    const gateVal = state.premissas.answers[f.sourceGateField];
    const gateArr = Array.isArray(gateVal) ? gateVal : [];
    if (gateArr.indexOf(f.sourceGateValue) !== -1) {
      const src = state.premissas.answers[f.sourceField];
      return Array.isArray(src) ? src : [];
    }
    return f.fallbackOptions || [];
  }
  const src = state.premissas.answers[f.sourceField];
  return Array.isArray(src) ? src : (f.fallbackOptions || []);
}

function renderAllocateField(id) {
  const f = fieldById(id);
  const container = document.getElementById('pfalloc-' + id);
  if (!f || !container) return;
  const list = allocateSourceList(f);
  const cur = (state.premissas.answers[id] && typeof state.premissas.answers[id] === 'object') ? state.premissas.answers[id] : {};
  if (!list.length) {
    container.innerHTML = `<div class="pf-note" style="margin:4px 0 0 0;">Sem eletrodomésticos identificados no ponto anterior.</div>`;
    return;
  }
  const rows = list.map(function(item) {
    const ikey = choiceKey(item);
    const btns = f.buckets.map(function(b) {
      const bkey = choiceKey(b);
      const active = cur[item] === b ? ' active' : '';
      return `<button type="button" class="pf-allocate-btn${active}" onclick="setAllocateBucket('${id}','${ikey}','${bkey}')">${escapeHtml(b)}</button>`;
    }).join('');
    return `<div class="pf-allocate-row">
      <div class="pf-allocate-name">${escapeHtml(item)}</div>
      <div class="pf-allocate-btns">${btns}</div>
    </div>`;
  }).join('');
  const missing = list.filter(function(item) { return !cur[item]; });
  const warning = missing.length ? `<div class="pf-allocate-warning">⚠ Falta atribuir: ${missing.map(escapeHtml).join(', ')}</div>` : '';
  container.innerHTML = rows + warning;
}

function setAllocateBucket(id, itemKey, bucketKey) {
  const f = fieldById(id);
  if (!f) return;
  const list = allocateSourceList(f);
  const item = list.find(function(x) { return choiceKey(x) === itemKey; });
  const bucket = f.buckets.find(function(b) { return choiceKey(b) === bucketKey; });
  if (!item || !bucket) return;
  const cur = (state.premissas.answers[id] && typeof state.premissas.answers[id] === 'object') ? Object.assign({}, state.premissas.answers[id]) : {};
  cur[item] = (cur[item] === bucket) ? undefined : bucket;
  if (!cur[item]) delete cur[item];
  state.premissas.answers[id] = cur;
  renderAllocateField(id);
  updatePremissasProgress();
  saveState();
}

function refreshAllocateFieldsDependingOn(changedId) {
  allPremissasFields().forEach(function(f) {
    if (f.type === 'allocate' && (f.sourceField === changedId || f.sourceGateField === changedId)) {
      renderAllocateField(f.id);
    }
  });
}

// ── conditional visibility (showIf: includes / includesAll / requires) ──
function refreshConditionalVisibility(parentId) {
  allPremissasFields().forEach(function(f) {
    if (f.showIf && f.showIf.field === parentId) {
      const el = document.getElementById('pfcond-' + f.id);
      if (el) el.classList.toggle('show', isFieldVisible(f));
      if (f.type === 'allocate') renderAllocateField(f.id);
    }
  });
}

function setPremissasText(id, val) {
  state.premissas.answers[id] = val;
  updatePremissasProgress();
  saveState();
}

function isFieldAnswered(f) {
  const v = state.premissas.answers[f.id];
  if (f.type === 'multiselect') return Array.isArray(v) && v.length > 0;
  if (f.type === 'allocate') return v && Object.keys(v).length > 0;
  return v !== undefined && v !== null && v !== '';
}

function isFieldVisible(f) {
  if (!f.showIf) return true;
  const parentVal = state.premissas.answers[f.showIf.field];
  const arr = Array.isArray(parentVal) ? parentVal : [];
  if (f.showIf.includes) return arr.indexOf(f.showIf.includes) !== -1;
  if (f.showIf.includesAll) return f.showIf.includesAll.every(function(v) { return arr.indexOf(v) !== -1; });
  if (f.showIf.requires) return !!(parentVal && parentVal[f.showIf.requires]);
  return true;
}

function updatePremissasProgress() {
  let total = 0, done = 0;
  PREMISSAS_SECTIONS.forEach(function(sec) {
    const fields = sec.groups ? sec.groups.reduce(function(a,g){ return a.concat(g.fields); }, []) : sec.fields;
    let secTotal = 0, secDone = 0;
    fields.forEach(function(f) {
      if (!isFieldVisible(f)) return;
      secTotal++; total++;
      if (isFieldAnswered(f)) { secDone++; done++; }
    });
    const meta = document.getElementById('pfmeta-' + sec.id);
    if (meta) { meta.textContent = secDone + ' / ' + secTotal; meta.classList.toggle('done', secDone === secTotal && secTotal>0); }
  });
  const fill = document.getElementById('pf-progress-fill');
  const label = document.getElementById('pf-progress-label');
  if (fill) fill.style.width = (total ? (done/total*100) : 0) + '%';
  if (label) label.textContent = done + ' / ' + total + ' respondidas';
}

function hydratePremissasUI() {
  allPremissasFields().forEach(function(f) {
    if (f.type === 'choice') refreshPremissasChoiceUI(f.id);
    else if (f.type === 'multiselect') refreshMultiselectUI(f.id);
    else if (f.type === 'allocate') renderAllocateField(f.id);
    else if (f.type === 'text' || f.type === 'number') {
      const el = document.getElementById('pftext-' + f.id);
      if (el) el.value = (state.premissas.answers[f.id] != null) ? state.premissas.answers[f.id] : '';
    }
  });
  allPremissasFields().forEach(function(f) {
    if (f.showIf) {
      const el = document.getElementById('pfcond-' + f.id);
      if (el) el.classList.toggle('show', isFieldVisible(f));
    }
  });
  updatePremissasProgress();
}

(function cleanupOldServiceWorker() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) { r.unregister(); });
    }).catch(function() {});
  }
  if (window.caches && caches.keys) {
    caches.keys().then(function(keys) { keys.forEach(function(k) { caches.delete(k); }); }).catch(function() {});
  }
})();

// ── Teclado no Android (MIUI e WebView): leva o campo focado para a zona visível ──
(function() {
  function nudge(el) {
    if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return;
    var rect = el.getBoundingClientRect();
    var vvHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    var mid = vvHeight / 2;
    var elMid = rect.top + rect.height / 2;
    if (elMid > mid) {
      var scrollAmt = elMid - mid + 20;
      window.scrollBy({ top: scrollAmt, behavior: 'smooth' });
    }
  }
  document.addEventListener('focusin', function(e) {
    var el = e.target;
    setTimeout(function() { nudge(el); }, 350);
    setTimeout(function() { nudge(el); }, 750);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function() {
      setTimeout(function() { nudge(document.activeElement); }, 100);
    });
  } else {
    window.addEventListener('resize', function() {
      setTimeout(function() { nudge(document.activeElement); }, 150);
    });
  }
})();

document.getElementById('photo-modal').addEventListener('click', function(e) {
  if (e.target === this) closePhoto();
});

// ════════════════════════════════════════
//  BOOTSTRAP
// ════════════════════════════════════════
(async function bootstrap() {
  const modeLine = document.getElementById('app-mode-line');
  if (modeLine) modeLine.textContent = 'Visita Técnica · ' + (IS_NATIVE ? 'APK' : 'PWA');
  bindHeaderInputListeners();
  renderHomeChoices();

  const cameBackFromAuth = consumeDriveRedirectToken();

  const saved = loadState();
  if (saved && saved.state) {
    state = normalizeState(saved.state);
    if (!state.sessionKey) state.sessionKey = buildProjectFolderName();   // sessão gravada por uma versão anterior
    lastLocalTs = saved.ts || 0;
    activeFlow = saved.activeFlow || null;
    fillHeaderInputs();
    if (activeFlow === 'checklist') {
      updateAppHeaders(); renderChecklist(); showScreen('checklist-screen');
    } else if (activeFlow === 'premissas') {
      updateAppHeaders(); renderPremissas(); showScreen('premissas-screen');
    }
    if (!cameBackFromAuth && (state.header.idImovel || state.header.morada)) {
      showToast('Sessão anterior restaurada.');
    }
  }

  setDriveStatus(driveState.status);
  if (driveState.connected) onDriveConnected();     // regresso do login Google (PWA): carrega as miniaturas

  // APK: liga ao Drive em silêncio (sem ecrãs, se já autorizaste antes) — o indicador fica logo ligado
  if (IS_NATIVE) await nativeSilentConnect(8000);
  _appReadyResolve();
})();

</script>
